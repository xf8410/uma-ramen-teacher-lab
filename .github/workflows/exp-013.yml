name: EXP-013 深教师成绩单（RamenMctsTrainer 首次闭环 bench）

# 教师成绩单 #1：深教师 = RamenMctsTrainer 全阶段搜索（产 008/009 标签的同款机器）
# 作为选手在 gen1 采样空间（525 计划 × 8 局，seed 61444）打满整局的闭环均分。
# 从未被 bench 过——这是分母实验（见 experiments/EXP-013-teacher-report-card/plan.md）。
#
# 流水线：build（补丁链+1 局熔断）→ smoke（5 计划×8 局量耗时）→ [mode=full] bench（12 分片+三锚）→ verdict。
# 默认 mode=full：一次 dispatch 跑完 冒烟+全量+裁决（smoke 不过，full 不起）。
# mode=smoke：只跑 build+smoke，量耗时用。
#
# 判读三档写死在 verdict.py（plan.md 合同），人不现场解释数字。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 冒烟→全量→裁决 一条龙（默认）；smoke = 只量耗时"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - smoke

env:
  UPSTREAM_REPO: muxueliunian/umaai-rs-muxue
  UPSTREAM_REF: d27a6ebd3e0e0daeadb1bd5a3d137b97747009d1
  MAIN_LAB_REPO: xf8410/uma-ramen-nn-lab
  NN_MODEL_REPO: xf8410/uma-ramen-nn-lab
  NN_MODEL_RUN: "33716171772"
  NN_MODEL_ARTIFACT: EXP-009-model-seed20260831
  PLANS_PER_SHARD: "88"

jobs:
  # ---------- 补丁链 + 构建 + 1 局熔断测试 ----------
  build:
    name: 补丁链 006c→d→e→fix→008→013 + build + 1 局熔断
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Verify upstream pin
        run: |
          GOT=$(git rev-parse HEAD)
          [ "$GOT" = "$UPSTREAM_REF" ] || { echo "PIN_MISMATCH: $GOT"; exit 1; }
      - name: Apply patch chain（006c → 006d → 006e → 006e_fix → 008 → 013，锚点断言 fail-fast）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp013-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp013-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build（feature onnx：nn-0831 对照臂需要）
        run: cargo build --release --features onnx -p umasim --bin ramen_space_bench
      - name: 1 局熔断测试（mcts 全阶段 1 局必须在 150s 内出数，否则就地红不进 smoke）
        run: |
          timeout 150 ./target/release/ramen_space_bench \
            --trainer mcts --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
            --mcts-selection pt --plans 1 --runs-per-plan 1 --seed 61444 2>&1 | tail -15
          echo "FUSE OK: 深教师单局可在超时内完成"

  # ---------- 冒烟：5 计划 × 8 局，量真实单局耗时（两种模式都跑；smoke 挂则 full 不起） ----------
  smoke:
    name: 冒烟（5 计划×8 局 mcts-pt，量耗时）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Apply patch chain（与 build 完全一致）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp013-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp013-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build
        run: cargo build --release --features onnx -p umasim --bin ramen_space_bench
      - name: 手写臂 5×8 冒烟（补丁没碰坏手写路径；秒级）
        run: |
          ./target/release/ramen_space_bench --trainer handwritten --variant base \
            --plans 5 --runs-per-plan 8 --seed 61444 2>&1 | tail -8
      - name: 深教师 5×8 冒烟（主口径 pt，量单局耗时）
        run: |
          mkdir -p experiment_output
          timeout 900 ./target/release/ramen_space_bench \
            --trainer mcts --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
            --mcts-selection pt --plans 5 --runs-per-plan 8 --seed 61444 \
            --csv experiment_output/exp013_mcts-pt-smoke.csv 2>&1 | tail -12
      - name: 冒烟读数（单局耗时分布 → 全量外推）
        run: |
          python3 lab/experiments/EXP-013-teacher-report-card/smoke_read.py \
            experiment_output/exp013_mcts-pt-smoke.csv
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-013-smoke
          path: experiment_output/
          retention-days: 30
          if-no-files-found: error

  # ---------- 全量 bench：12 深教师分片 + 三锚（仅在 mode=full 且冒烟已过时起跑） ----------
  bench:
    name: bench (${{ matrix.id }})
    if: github.event.inputs.mode == 'full'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # 三保真锚（全量 525 计划单 job；手写秒级、NN ~10 分钟）
          - { id: hw-default,  trainer: handwritten, variant: base }
          - { id: hw-champion, trainer: handwritten, variant: g2420-o2150-o3150-g3160-cook60 }
          - { id: nn-0831,     trainer: nn }
          # 深教师主口径 pt：6 分片（每片 88 计划，末片 85）
          - { id: mcts-pt-s0,    trainer: mcts, selection: pt,    offset: 0 }
          - { id: mcts-pt-s1,    trainer: mcts, selection: pt,    offset: 88 }
          - { id: mcts-pt-s2,    trainer: mcts, selection: pt,    offset: 176 }
          - { id: mcts-pt-s3,    trainer: mcts, selection: pt,    offset: 264 }
          - { id: mcts-pt-s4,    trainer: mcts, selection: pt,    offset: 352 }
          - { id: mcts-pt-s5,    trainer: mcts, selection: pt,    offset: 440 }
          # 深教师副口径 score（只报不裁决）
          - { id: mcts-score-s0, trainer: mcts, selection: score, offset: 0 }
          - { id: mcts-score-s1, trainer: mcts, selection: score, offset: 88 }
          - { id: mcts-score-s2, trainer: mcts, selection: score, offset: 176 }
          - { id: mcts-score-s3, trainer: mcts, selection: score, offset: 264 }
          - { id: mcts-score-s4, trainer: mcts, selection: score, offset: 352 }
          - { id: mcts-score-s5, trainer: mcts, selection: score, offset: 440 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Apply patch chain（与 build 完全一致）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp013-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp013-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build
        run: cargo build --release --features onnx -p umasim --bin ramen_space_bench
      - name: Download NN model（仅 nn-0831 臂）
        if: matrix.trainer == 'nn'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.NN_MODEL_ARTIFACT }}
          path: models/nn-0831
          repository: ${{ env.NN_MODEL_REPO }}
          run-id: ${{ env.NN_MODEL_RUN }}
          github-token: ${{ github.token }}
      - name: Verify model files
        if: matrix.trainer == 'nn'
        run: |
          [ -f models/nn-0831/model.onnx ] && [ -f models/nn-0831/model.onnx.json ] \
            || { echo "缺 model.onnx 或 sidecar"; exit 1; }
      - name: Run bench (${{ matrix.id }})
        run: |
          mkdir -p experiment_output
          ARGS="--runs-per-plan 8 --seed 61444 --csv experiment_output/exp013_${{ matrix.id }}.csv"
          case "${{ matrix.trainer }}" in
            handwritten)
              ./target/release/ramen_space_bench --trainer handwritten \
                --variant "${{ matrix.variant }}" $ARGS 2>&1 | tail -10 ;;
            nn)
              ./target/release/ramen_space_bench --trainer nn \
                --model models/nn-0831/model.onnx $ARGS 2>&1 | tail -10 ;;
            mcts)
              PLANS=$(python3 -c "print(min(${{ env.PLANS_PER_SHARD }}, 525 - ${{ matrix.offset }}))")
              echo "分片 ${{ matrix.id }}: plan_offset=${{ matrix.offset }} plans=$PLANS"
              ./target/release/ramen_space_bench --trainer mcts \
                --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
                --mcts-selection "${{ matrix.selection }}" \
                --plan-offset ${{ matrix.offset }} --plans "$PLANS" $ARGS 2>&1 | tail -10 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-013-bench-${{ matrix.id }}
          path: experiment_output/
          retention-days: 30
          if-no-files-found: error

  # ---------- 裁决（唯一判据；三档合同在 verdict.py 内） ----------
  summary:
    name: 闭环配对裁决（三档判读）
    if: github.event.inputs.mode == 'full'
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-013-bench-*
          path: downloaded
          merge-multiple: false
      - name: EXP-013 verdict（保真锚 → 配对 → 三档判读）
        run: |
          python3 lab/experiments/EXP-013-teacher-report-card/verdict.py downloaded
      - name: 贴到 job summary
        run: cat SUMMARY.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-013-summary
          path: SUMMARY.txt
          retention-days: 90
          if-no-files-found: error
