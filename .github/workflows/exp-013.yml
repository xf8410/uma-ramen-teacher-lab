name: EXP-013 教师成绩单（产标签机器的首次闭环 bench）

# EXP-013 v4（第三次点火；成本模型经两次实测标定后定稿）：
#
# 硬数据：
#   熔断：1 局 = 67.9s 墙钟（4 vCPU，搜索内部吃满 4 核）→ 单局核时 ≈ 271 core·s
#   冒烟 run-3：16 局（2 计划并行×8 局）900s 未完成 → 核时 ≥ 225 core·s/局（与熔断一致）
#   → 旧预算全作废：8 rep×4200 局 = 316 core·h/臂，20 片×216 局 = 244min/片 > 180min 必红
#
# v4 预算（合同修订，见 plan.md 修订节）：
#   8 rep → 4 rep（2100 局/臂）：三档边界 ±1500 对配对 SE≈±72 是 20σ，判读零影响
#   单臂 pt（score 副口径砍除，要时一条命令补跑）
#   分片：20 片 × 27 计划 × 4 局 = 108 局/片 ≈ 122min < 180min（1.47× 余量）
#   锚臂保持 8 rep（手写秒级 / NN ~15min，4200 行与历史逐位可比）
#   总墙钟 ≈ build 5min + smoke 9min + bench ~120min + verdict 2min ≈ 2.3h

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 冒烟→全量→裁决 一条龙（默认）；smoke = 只量耗时"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - smoke

env:
  UPSTREAM_REPO: muxueliunian/umaai-rs-muxue
  UPSTREAM_REF: d27a6ebd3e0e0daeadb1bd5a3d137b97747009d1
  MAIN_LAB_REPO: xf8410/uma-ramen-nn-lab
  NN_MODEL_REPO: xf8410/uma-ramen-nn-lab
  NN_MODEL_RUN: "33716171772"
  NN_MODEL_ARTIFACT: EXP-009-model-seed20260831
  PLANS_PER_SHARD: "27"
  MCTS_RUNS_PER_PLAN: "4"

jobs:
  # ---------- 补丁链 + 构建 + 1 局熔断测试 ----------
  build:
    name: 补丁链 006c→d→e→fix→008→013v2 + build + 1 局熔断
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Verify upstream pin
        run: |
          GOT=$(git rev-parse HEAD)
          [ "$GOT" = "$UPSTREAM_REF" ] || { echo "PIN_MISMATCH: $GOT"; exit 1; }
      - name: Apply patch chain（006c → 006d → 006e → 006e_fix → 008 → 013v2，锚点断言 fail-fast）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp013v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp013v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build（feature onnx：nn-0831 对照臂需要）
        run: cargo build --release --features onnx -p umasim --bin ramen_space_bench
      - name: 1 局熔断测试（mcts 全阶段 1 局必须在 150s 内出数，否则就地红不进 smoke）
        run: |
          timeout 150 ./target/release/ramen_space_bench \
            --trainer mcts --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
            --mcts-selection pt --plans 1 --runs-per-plan 1 --seed 61444 2>&1 | tail -15
          echo "FUSE OK: 教师单局可在超时内完成"

  # ---------- 冒烟：2 计划 × 4 局 = 8 局（约 9 分钟；smoke 挂则 full 不起） ----------
  smoke:
    name: 冒烟（2 计划×4 局 mcts-pt，量耗时）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Apply patch chain（与 build 完全一致）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp013v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp013v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build
        run: cargo build --release --features onnx -p umasim --bin ramen_space_bench
      - name: 手写臂 2×8 冒烟（补丁没碰坏手写路径；秒级）
        run: |
          ./target/release/ramen_space_bench --trainer handwritten --variant base \
            --plans 2 --runs-per-plan 8 --seed 61444 2>&1 | tail -8
      - name: 教师选手 2×4 冒烟（主口径 pt，量单局耗时；8 局 ≈ 9min）
        run: |
          mkdir -p experiment_output
          timeout 1500 ./target/release/ramen_space_bench \
            --trainer mcts --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
            --mcts-selection pt --plans 2 --runs-per-plan 4 --seed 61444 \
            --csv experiment_output/exp013_smoke.csv 2>&1 | tail -12
      - name: 冒烟读数（单局耗时分布 → 全量外推）
        run: |
          python3 lab/experiments/EXP-013-teacher-report-card/smoke_read.py \
            experiment_output/exp013_smoke.csv
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-013-smoke
          path: experiment_output/
          retention-days: 30
          if-no-files-found: error

  # ---------- 全量 bench：20 教师分片 + 三锚（仅在 mode=full 且冒烟已过时起跑） ----------
  bench:
    name: bench (${{ matrix.id }})
    if: github.event.inputs.mode == 'full'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # 三保真锚（全量 525 计划 × 8 局单 job；手写秒级、NN ~15 分钟；与历史逐位可比）
          - { id: hw-default,  trainer: handwritten, variant: base }
          - { id: hw-champion, trainer: handwritten, variant: g2420-o2150-o3150-g3160-cook60 }
          - { id: nn-0831,     trainer: nn }
          # 教师选手主口径 pt：20 分片 × 27 计划 × 4 局 = 108 局/片（末片 21 计划）
          - { id: mcts-pt-s0,  trainer: mcts, offset: 0 }
          - { id: mcts-pt-s1,  trainer: mcts, offset: 27 }
          - { id: mcts-pt-s2,  trainer: mcts, offset: 54 }
          - { id: mcts-pt-s3,  trainer: mcts, offset: 81 }
          - { id: mcts-pt-s4,  trainer: mcts, offset: 108 }
          - { id: mcts-pt-s5,  trainer: mcts, offset: 135 }
          - { id: mcts-pt-s6,  trainer: mcts, offset: 162 }
          - { id: mcts-pt-s7,  trainer: mcts, offset: 189 }
          - { id: mcts-pt-s8,  trainer: mcts, offset: 216 }
          - { id: mcts-pt-s9,  trainer: mcts, offset: 243 }
          - { id: mcts-pt-s10, trainer: mcts, offset: 270 }
          - { id: mcts-pt-s11, trainer: mcts, offset: 297 }
          - { id: mcts-pt-s12, trainer: mcts, offset: 324 }
          - { id: mcts-pt-s13, trainer: mcts, offset: 351 }
          - { id: mcts-pt-s14, trainer: mcts, offset: 378 }
          - { id: mcts-pt-s15, trainer: mcts, offset: 405 }
          - { id: mcts-pt-s16, trainer: mcts, offset: 432 }
          - { id: mcts-pt-s17, trainer: mcts, offset: 459 }
          - { id: mcts-pt-s18, trainer: mcts, offset: 486 }
          - { id: mcts-pt-s19, trainer: mcts, offset: 513 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Apply patch chain（与 build 完全一致）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp013v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp013v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build
        run: cargo build --release --features onnx -p umasim --bin ramen_space_bench
      - name: Download NN model（仅 nn-0831 臂）
        if: matrix.trainer == 'nn'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.NN_MODEL_ARTIFACT }}
          path: models/nn-0831
          repository: ${{ env.NN_MODEL_REPO }}
          run-id: ${{ env.NN_MODEL_RUN }}
          github-token: ${{ github.token }}
      - name: Verify model files
        if: matrix.trainer == 'nn'
        run: |
          [ -f models/nn-0831/model.onnx ] && [ -f models/nn-0831/model.onnx.json ] \
            || { echo "缺 model.onnx 或 sidecar"; exit 1; }
      - name: Run bench (${{ matrix.id }})
        run: |
          mkdir -p experiment_output
          ARGS="--seed 61444 --csv experiment_output/exp013_${{ matrix.id }}.csv"
          case "${{ matrix.trainer }}" in
            handwritten)
              ./target/release/ramen_space_bench --trainer handwritten \
                --variant "${{ matrix.variant }}" --runs-per-plan 8 $ARGS 2>&1 | tail -10 ;;
            nn)
              ./target/release/ramen_space_bench --trainer nn \
                --model models/nn-0831/model.onnx --runs-per-plan 8 $ARGS 2>&1 | tail -10 ;;
            mcts)
              PLANS=$(python3 -c "print(min(${{ env.PLANS_PER_SHARD }}, 525 - ${{ matrix.offset }}))")
              echo "分片 ${{ matrix.id }}: plan_offset=${{ matrix.offset }} plans=$PLANS runs=${{ env.MCTS_RUNS_PER_PLAN }}"
              ./target/release/ramen_space_bench --trainer mcts \
                --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
                --mcts-selection pt \
                --plan-offset ${{ matrix.offset }} --plans "$PLANS" \
                --runs-per-plan ${{ env.MCTS_RUNS_PER_PLAN }} $ARGS 2>&1 | tail -10 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-013-bench-${{ matrix.id }}
          path: experiment_output/
          retention-days: 30
          if-no-files-found: error

  # ---------- 裁决（唯一判据；三档合同在 verdict.py 内） ----------
  summary:
    name: 闭环配对裁决（三档判读）
    if: github.event.inputs.mode == 'full'
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-013-bench-*
          path: downloaded
          merge-multiple: false
      - name: EXP-013 verdict（保真锚 → 配对 → 三档判读）
        run: |
          python3 lab/experiments/EXP-013-teacher-report-card/verdict.py downloaded
      - name: 贴到 job summary
        run: cat SUMMARY.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-013-summary
          path: SUMMARY.txt
          retention-days: 90
          if-no-files-found: error
