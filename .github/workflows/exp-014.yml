name: EXP-014 on-policy 教师重采（变量 C 采集 + 重训 + 裁决 一条龙）

# EXP-014：用 EXP-013 验证过的教师选手（68407.3 闭环分）边打边采，
# 修掉 160k 标签的最大结构缺陷——状态分布来自被扰动轨迹而非教师自己的世界（变量 C）。
#
# 实测进展（run 33965115459）：
# - 编译 ✅、1 局熔断出 manifest ✅
# - 冒烟 CRN：采集 68257 == 纯 bench 68257 逐位一致 → record_ordered 中性实证通过
# - 但 accepted=0：钩子从未成功落样本 → diag 探针（init/hook/record/finalize 四点）
#   + fuse 硬断言 accepted>0 + 冒烟回显 manifest + 上传样本目录
#
# 本次修订（yamlfix）：notify 的 --body 多行字符串有列 0 续行，把 run: | 块标量提前截断，
# 整个 workflow 解析失败 → push 幽灵红跑 + dispatch 422。改为单行 BODY 变量。
#
# 补丁链：006c→d→e→fix→008→013v3→014v3→014fix3→014diag。
# 流水线：build → smoke(CRN 对拍) → collect(10 片) → convert(--raw)+labels → train 3 种子 → verdict 6 臂
#         → notify（无论成败开 Issue：GitHub 邮件/手机 App 推送）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 冒烟→采集→训练→裁决 一条龙；smoke = 只跑采集冒烟对拍"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - smoke

env:
  UPSTREAM_REPO: muxueliunian/umaai-rs-muxue
  UPSTREAM_REF: d27a6ebd3e0e0daeadb1bd5a3d137b97747009d1
  MAIN_LAB_REPO: xf8410/uma-ramen-nn-lab
  PLANS_PER_SHARD: "53"
  RUNS_PER_PLAN: "2"
  EXPORT_SHARD: "256"

jobs:
  # ---------- 补丁链 + 构建 + 1 局采集熔断 ----------
  build:
    name: 补丁链 + build + 1 局采集熔断（accepted>0 硬闸门）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Verify upstream pin
        run: |
          GOT=$(git rev-parse HEAD)
          [ "$GOT" = "$UPSTREAM_REF" ] || { echo "PIN_MISMATCH: $GOT"; exit 1; }
      - name: Apply patch chain（锚点 fail-fast）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_fix3.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_diag.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build（bench + export_npy 两个二进制）
        run: |
          cargo build --release -p umasim --bin ramen_space_bench
          cargo build --release -p umasim --bin ramen_export_npy
      - name: 1 局采集熔断（150s 内出样本；accepted>0 否则就地红）
        run: |
          rm -rf target/exp014_fuse
          timeout 150 ./target/release/ramen_space_bench \
            --trainer mcts --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
            --mcts-selection pt --plans 1 --runs-per-plan 1 --seed 61444 \
            --export-samples target/exp014_fuse --export-shard-size ${{ env.EXPORT_SHARD }} \
            2>&1 | grep -E "EXP-014|合计|局数|均分|耗时|CSV" | tail -25
          test -f target/exp014_fuse/manifest.json || { echo "FUSE FAIL: 无 manifest"; exit 1; }
          python3 - <<'PY'
          import json
          m = json.load(open("target/exp014_fuse/manifest.json"))
          print("FUSE manifest:", {k: m.get(k) for k in ("accepted", "index_start", "index_end", "search_n")})
          assert m["accepted"] > 0, f"熔断局 0 样本——钩子未生效: accepted={m['accepted']}"
          PY
          echo "FUSE OK: 采集熔断通过且真的落了样本"

  # ---------- 冒烟：2 计划×2 局采集 + CRN 对拍（硬闸门） ----------
  smoke:
    name: 采集冒烟 + CRN 对拍（record_ordered 中性实证）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Apply patch chain（与 build 完全一致）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_fix3.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_diag.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build
        run: cargo build --release -p umasim --bin ramen_space_bench
      - name: 采集冒烟（2 计划×2 局，~4.5min）
        run: |
          rm -rf target/exp014_smoke
          mkdir -p experiment_output
          timeout 1200 ./target/release/ramen_space_bench \
            --trainer mcts --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
            --mcts-selection pt --plans 2 --runs-per-plan 2 --seed 61444 \
            --export-samples target/exp014_smoke --export-shard-size ${{ env.EXPORT_SHARD }} \
            --csv experiment_output/exp014_smoke.csv 2>&1 | grep -E "EXP-014|合计|局数|均分|标准差|自选|耗时|CSV" | tail -40
      - name: 冒烟样本落盘快照（manifest + 目录）
        run: |
          cat target/exp014_smoke/manifest.json
          ls -la target/exp014_smoke/ | head -20
      - name: 纯 bench 对照（同 2 计划，无 export，供 CRN 对拍）
        run: |
          ./target/release/ramen_space_bench \
            --trainer mcts --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
            --mcts-selection pt --plans 2 --runs-per-plan 2 --seed 61444 \
            --csv experiment_output/exp014_smoke_ref.csv 2>&1 | tail -6
      - name: 冒烟闸门（manifest 一致性 + CRN 逐位对拍 + 体量投影）
        run: |
          python3 lab/experiments/EXP-014-onpolicy-collect/smoke_check.py \
            --samples target/exp014_smoke \
            --smoke-csv experiment_output/exp014_smoke.csv \
            --ref-csv experiment_output/exp014_smoke_ref.csv \
            --expect-min-samples 40 \
            --project-games 1050
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-014-smoke
          path: |
            experiment_output/
            target/exp014_smoke/
          retention-days: 30
          if-no-files-found: error

  # ---------- 全量采集：10 片 × 53 计划 × 2 局 ----------
  collect:
    name: collect (offset-${{ matrix.offset }})
    if: github.event.inputs.mode == 'full'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { offset: 0 }
          - { offset: 53 }
          - { offset: 106 }
          - { offset: 159 }
          - { offset: 212 }
          - { offset: 265 }
          - { offset: 318 }
          - { offset: 371 }
          - { offset: 424 }
          - { offset: 477 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Apply patch chain（与 build 完全一致）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_fix3.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_diag.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build
        run: cargo build --release -p umasim --bin ramen_space_bench
      - name: Run collect (offset=${{ matrix.offset }})
        run: |
          PLANS=$(python3 -c "print(min(${{ env.PLANS_PER_SHARD }}, 525 - ${{ matrix.offset }}))")
          echo "片 offset=${{ matrix.offset }} plans=$PLANS runs=${{ env.RUNS_PER_PLAN }}"
          timeout 8500 ./target/release/ramen_space_bench \
            --trainer mcts --mcts-stages all --mcts-search-n 64 --mcts-radical 1.4 \
            --mcts-selection pt \
            --plan-offset ${{ matrix.offset }} --plans "$PLANS" \
            --runs-per-plan ${{ env.RUNS_PER_PLAN }} --seed 61444 \
            --export-samples "target/exp014_shard_${{ matrix.offset }}" \
            --export-shard-size ${{ env.EXPORT_SHARD }} \
            2>&1 | grep -E "EXP-014|合计|均分" | tail -12
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-014-shard-${{ matrix.offset }}
          path: target/exp014_shard_${{ matrix.offset }}/
          retention-days: 30
          if-no-files-found: error

  # ---------- 合并 + 转 npy(--raw) + 生成标签 ----------
  convert:
    name: assemble + convert(--raw) + labels
    if: github.event.inputs.mode == 'full'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Apply patch chain（与 build 完全一致）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_fix3.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_diag.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build export_npy
        run: cargo build --release -p umasim --bin ramen_export_npy
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-014-shard-*
          path: shards
          merge-multiple: false
      - name: Assemble 10 片 → 采集目录
        run: |
          python3 - <<'PY'
          import json, glob, os, shutil

          found = {}
          for d in sorted(glob.glob("shards/EXP-014-shard-*")):
              tag = os.path.basename(d)
              offset = int(tag.rsplit("-", 1)[1])
              assert offset not in found, f"分片 {offset} 重复"
              found[offset] = d
          assert len(found) == 10, f"分片数不对: {len(found)}"
          assert sorted(found) == [0, 53, 106, 159, 212, 265, 318, 371, 424, 477]

          os.makedirs("dataset", exist_ok=True)
          base = None
          parts, gidx, total = [], 0, 0
          hits0 = None
          for offset in sorted(found):
              d = found[offset]
              hits = glob.glob(f"{d}/**/manifest.json", recursive=True)
              assert len(hits) == 1, f"shard {offset}: manifest 数 {len(hits)}"
              pdir = os.path.dirname(hits[0])
              m = json.load(open(hits[0]))
              assert m["finished_at"], f"shard {offset} 未完成"
              assert m["search_n"] == 64, f"shard {offset} search_n={m['search_n']}"
              assert m["git_commit"] == "d27a6ebd3e0e0daeadb1bd5a3d137b97747009d1", f"shard {offset} git {m['git_commit']}"
              if base is None:
                  base = m["recipe_hash_fnv1a64"]
                  hits0 = hits[0]
              assert m["recipe_hash_fnv1a64"] == base, f"shard {offset} 配方不一致"
              for p in sorted(m["parts"], key=lambda x: x["name"]):
                  shutil.copy(os.path.join(pdir, p["name"]), f"dataset/part_{gidx:06d}.bin")
                  parts.append({**p, "name": f"part_{gidx:06d}.bin"})
                  gidx += 1
              total += m["accepted"]
              print(f"shard offset={offset}: accepted={m['accepted']} index=[{m['index_start']},{m['index_end']})")
          merged = {**json.load(open(hits0)), "parts": parts, "accepted": total}
          json.dump(merged, open("dataset/manifest.json", "w"), ensure_ascii=False, indent=2)
          print(f"MERGED: accepted={total} parts={gidx}")
          assert total > 100000, f"总样本过少: {total}"
          PY
      - name: Convert → npy（--raw：labels.py 需要 cand_scores/cand_valid）
        run: |
          ./target/release/ramen_export_npy --input dataset --output-dir training_data/npy_onpolicy --raw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install python deps (numpy)
        run: pip install numpy
      - name: Generate labels（Bayesian bootstrap 软标签 + cross-fit value，口径与 160k 相同）
        run: |
          python3 scripts/ramen_nn/labels.py \
            --input training_data/npy_onpolicy \
            --output training_data/labels_onpolicy
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-014-npy-labels
          path: |
            training_data/npy_onpolicy
            training_data/labels_onpolicy
          retention-days: 30
          if-no-files-found: error

  # ---------- 训练 3 种子（CPU；CLI 实抄 exp-010.yml） ----------
  train:
    name: train (seed ${{ matrix.seed }})
    if: github.event.inputs.mode == 'full'
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { seed: "20260830" }
          - { seed: "20260831" }
          - { seed: "20260832" }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install python deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy onnx onnxruntime
      - uses: actions/download-artifact@v4
        with:
          name: EXP-014-npy-labels
          path: training_data
      - name: Train (seed=${{ matrix.seed }})
        run: |
          python3 scripts/ramen_nn/train.py \
            --data training_data/npy_onpolicy \
            --labels training_data/labels_onpolicy \
            --output-dir saved_models/${{ matrix.seed }} \
            --seed ${{ matrix.seed }} \
            --device cpu \
            --epochs 400 \
            --patience 12
      - name: Export ONNX
        run: |
          python3 scripts/ramen_nn/export_onnx.py \
            --checkpoint saved_models/${{ matrix.seed }}/best.pt \
            --output saved_models/${{ matrix.seed }}/model.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-014-model-${{ matrix.seed }}
          path: saved_models/${{ matrix.seed }}
          retention-days: 30
          if-no-files-found: error

  # ---------- 裁决：3 新模型 + nn-0831 + 双手写锚，4200 局配对 ----------
  verdict:
    name: 闭环裁决（C 收益判定）
    if: github.event.inputs.mode == 'full'
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: hw-default, model: "" }
          - { id: hw-champion, model: "" }
          - { id: nn-0831, model: "nn0831" }
          - { id: nn014-0830, model: "20260830" }
          - { id: nn014-0831, model: "20260831" }
          - { id: nn014-0832, model: "20260832" }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_LAB_REPO }}
          ref: main
          path: lab-main
      - name: Apply patch chain（与 build 完全一致）
        run: |
          set -e
          python3 lab-main/experiments/EXP-006-wisdom-vital/patch_exp006c.py
          python3 lab-main/experiments/EXP-006-yearphased/patch_exp006d.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e.py
          python3 lab-main/experiments/EXP-006e-power/patch_exp006e_fix.py
          python3 lab-main/experiments/EXP-008-distill-v2/patch_exp008.py
          python3 lab/experiments/EXP-013-teacher-report-card/patch_exp013.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_fix3.py
          python3 lab/experiments/EXP-014-onpolicy-collect/patch_exp014_diag.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exp014-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build（bench，onnx feature：全部 NN 臂需要）
        run: cargo build --release --features onnx -p umasim --bin ramen_space_bench
      - name: Download model（${{ matrix.id }}）
        if: matrix.model != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.model == 'nn0831' && 'EXP-009-model-seed20260831' || format('EXP-014-model-{0}', matrix.model) }}
          path: models/${{ matrix.id }}
          repository: ${{ matrix.model == 'nn0831' && 'xf8410/uma-ramen-nn-lab' || github.repository }}
          run-id: ${{ matrix.model == 'nn0831' && '33716171772' || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify model files
        if: matrix.model != ''
        run: |
          find models/${{ matrix.id }} -name "model.onnx" | grep -q . || { echo "缺 model.onnx"; exit 1; }
      - name: Bench (${{ matrix.id }})
        run: |
          mkdir -p experiment_output
          ONNX=$(find models/${{ matrix.id }} -name model.onnx | head -1)
          ARGS="--seed 61444 --csv experiment_output/exp014_${{ matrix.id }}.csv"
          case "${{ matrix.id }}" in
            hw-default)
              ./target/release/ramen_space_bench --trainer handwritten --variant base \
                --runs-per-plan 8 $ARGS 2>&1 | tail -6 ;;
            hw-champion)
              ./target/release/ramen_space_bench --trainer handwritten \
                --variant g2420-o2150-o3150-g3160-cook60 \
                --runs-per-plan 8 $ARGS 2>&1 | tail -6 ;;
            *)
              [ -n "$ONNX" ] && [ -f "$ONNX" ] || { echo "model.onnx 缺失"; exit 1; }
              ./target/release/ramen_space_bench --trainer nn \
                --model "$ONNX" \
                --runs-per-plan 8 $ARGS 2>&1 | tail -6 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-014-bench-${{ matrix.id }}
          path: experiment_output/
          retention-days: 30
          if-no-files-found: error

  summary:
    name: 配对 summary（vs 手写 / vs nn-0831）
    if: github.event.inputs.mode == 'full'
    needs: verdict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-014-bench-*
          path: downloaded
          merge-multiple: false
      - name: EXP-014 verdict
        run: |
          python3 lab/experiments/EXP-014-onpolicy-collect/verdict_014.py downloaded
      - name: 贴到 job summary
        run: cat SUMMARY.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-014-summary
          path: SUMMARY.txt
          retention-days: 90
          if-no-files-found: error

  # ---------- 结果通知（无论成败开 Issue → GitHub 邮件/手机 App 推送） ----------
  notify:
    name: 结果通知（Issue）
    needs: [build, smoke, collect, convert, train, verdict, summary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 汇总各 job 结论并开 Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="EXP-014 run ${{ github.run_id }}: ${{ contains(needs.*.result, 'failure') && '❌ 有失败' || '✅ 跑完' }}"
          BODY="结论：build=${{ needs.build.result }} smoke=${{ needs.smoke.result }} collect=${{ needs.collect.result }} convert=${{ needs.convert.result }} train=${{ needs.train.result }} verdict=${{ needs.verdict.result }} summary=${{ needs.summary.result }}；run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}；全绿时看 artifact EXP-014-summary（三种子配对裁决）；有失败时把失败 job 的日志贴给会话里的 Claude 即可定位"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
